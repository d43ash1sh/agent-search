services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agent-search-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agent_search}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-agent_search}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agent-search-net

  redis:
    image: redis:7-alpine
    container_name: agent-search-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - agent-search-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-search-app
    restart: unless-stopped
    command: ["python", "run_all.py", "--no-docker"]
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_URL=postgresql://postgres:postgres@postgres:5432/agent_search
      - REDIS_URL=redis://redis:6379/0
      - INDEX_BACKEND=postgres
      - API_HOST=0.0.0.0
      - API_PORT=8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agent-search-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  agent-search-net:
    driver: bridge
