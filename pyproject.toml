[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-search-crawler"
version = "0.1.0"
description = "A polite Scrapy crawler with SQLite FTS5 search index and FastAPI retrieval API."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "Scrapy>=2.18,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11",
    "mypy>=1.15",
    "pytest>=8",
    "pytest-cov>=6",
    "pre-commit>=4",
]

[project.scripts]
crawler = "crawler.__main__:main"

[tool.setuptools.packages.find]
include = ["crawler*"]
exclude = ["tests*"]

# ── Ruff (linter + formatter) ──────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",   # line too long – handled by formatter
    "SIM108", # ternary – sometimes less readable
]

[tool.ruff.lint.isort]
known-first-party = ["crawler"]

# ── Mypy ───────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "scrapy.*",
    "w3lib.*",
    "asyncpg.*",
    "pgvector.*",
    "fastembed.*",
    "flashrank.*",
]
ignore_missing_imports = true

# ── Pytest ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]

# ── Coverage ───────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["crawler"]
omit = ["crawler/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 70
