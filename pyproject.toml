[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-search"
version = "0.2.0"
description = "High-performance search, crawl, and retrieval engine for AI agents with hybrid vector search, neural reranking, Playwright pool, and MCP protocol."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "Scrapy>=2.11,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.27",
    "asyncpg>=0.29",
    "pgvector>=0.2",
    "redis>=5.0",
    "trafilatura>=1.8",
    "fastembed>=0.2",
    "flashrank>=0.2",
    "playwright>=1.40",
    "pydantic>=2.0",
    "curl-cffi>=0.7",
    "mcp>=1.0.0",
    "parsel>=1.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8",
    "pytest-cov>=6",
    "pre-commit>=4",
]

[project.scripts]
crawler = "crawler.__main__:main"
agent-search = "run_all:main"
agent-mcp = "run_mcp:main"

[tool.setuptools.packages.find]
include = ["crawler*", "services*"]
exclude = ["tests*"]

# ── Ruff (linter + formatter) ──────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",   # line too long – handled by formatter
    "SIM108", # ternary – sometimes less readable
]

[tool.ruff.lint.isort]
known-first-party = ["crawler"]

# ── Mypy ───────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "scrapy.*",
    "w3lib.*",
    "asyncpg.*",
    "pgvector.*",
    "fastembed.*",
    "flashrank.*",
]
ignore_missing_imports = true

# ── Pytest ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]

# ── Coverage ───────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["crawler"]
omit = ["crawler/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 70
